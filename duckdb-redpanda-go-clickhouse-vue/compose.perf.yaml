# Linux benchmark override. Only numbers from this setup go in the report:
#   docker compose -f compose.yaml -f compose.perf.yaml up -d
# (or export COMPOSE_FILE=compose.yaml:compose.perf.yaml for the bench/ scripts)
#
# - Redpanda without dev-container mode, which disables fsync and enables
#   write caching and so inflates throughput.
# - Every service pinned to its own cores (CPUS_* in .env).
# - No memory limits below the host; ClickHouse takes what is left.
# - No fixed host ports on the scaled services.

services:
  redpanda:
    command:
      - redpanda
      - start
      - --smp=${REDPANDA_SMP}
      - --memory=${REDPANDA_MEMORY}
      - --reserve-memory=0M
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    cpuset: ${CPUS_REDPANDA}

  clickhouse:
    cpuset: ${CPUS_CLICKHOUSE}

  signal:
    cpuset: ${CPUS_SIGNAL}

  replayer:
    cpuset: ${CPUS_REPLAYER}

  gateway:
    cpuset: ${CPUS_GATEWAY}
    ports: !reset []
